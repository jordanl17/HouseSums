name: CI

on:
  pull_request:
  # main is checked by the deploy workflow, which calls this one before it deploys.
  push:
    branches-ignore: [main]
  workflow_call:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: Check, lint, test, build and e2e
    runs-on: ubuntu-latest
    # Phase 6: Lighthouse (about 5 minutes) runs after the e2e suite.
    timeout-minutes: 35
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint and format check
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Uses the default BASE_PATH (/HouseSums), the same as production.
      - name: Build
        run: npm run build

      - name: JS budget
        run: npm run budget

      # Every internal link, asset, og:image, canonical and sitemap entry resolves to a built file.
      - name: Link check
        run: npm run check:links

      # Unique titles and descriptions, one h1, canonical, no em-dashes, JSON-LD shape, sitemap,
      # and each area page's static answer equal to the engine at typical assumptions.
      - name: Page quality
        run: npm run check:pages

      # The same build and checks at BASE_PATH=/ (the future custom domain), in a temp folder so
      # the e2e tests below still run against the /HouseSums build.
      - name: Build and check at the root base path
        env:
          BASE_PATH: /
          SITE_URL: https://housesums.co.uk
          DIST_DIR: ${{ runner.temp }}/dist-root
        run: |
          npx astro build --outDir "$DIST_DIR"
          npm run check:links
          npm run check:pages

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Playwright's webServer runs astro preview on the build above.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      # Phase 6: Lighthouse on / and /rent-vs-buy/leeds/, mobile and desktop, three runs each on
      # astro preview of the build above. Fails unless the median scores are 95+ in performance,
      # accessibility, best practices and SEO, and the median run's LCP, TBT and CLS are within
      # THRESHOLDS in scripts/lighthouse.mjs. Scores land in the job summary.
      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: lighthouse/
          if-no-files-found: ignore
          retention-days: 14
