name: CI

on:
  pull_request:
  push:
    branches: ['**']

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: Check, lint, test, build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint and format check
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Uses the default BASE_PATH (/HouseSums), the same as production.
      - name: Build
        run: npm run build

      - name: JS budget
        run: npm run budget

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Playwright's webServer runs astro preview on the build above.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
