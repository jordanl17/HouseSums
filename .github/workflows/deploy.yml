name: Deploy to GitHub Pages

# Every push to main runs the full CI suite, deploys only if it passes, then runs
# the end-to-end suite against the live site. A red run here means main is broken.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A deploy in progress is allowed to finish rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pages must be switched on (Settings, Pages, Source: GitHub Actions). GITHUB_TOKEN can't do it.
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://jordanl17.github.io
          BASE_PATH: /HouseSums
          PUBLIC_BUILD_SHA: ${{ github.sha }}
          # Cookieless analytics: off unless the GOATCOUNTER_CODE repository variable is set.
          PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}

      - name: JS budget
        run: npm run budget

      # The artifact about to ship, checked with the same site and base path it was built with.
      - name: Link check
        run: npm run check:links
        env:
          SITE_URL: https://jordanl17.github.io
          BASE_PATH: /HouseSums

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  live:
    name: Test the live site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LIVE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests against the live site
        run: npm run test:live

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
