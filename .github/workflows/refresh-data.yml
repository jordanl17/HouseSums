name: Refresh data

# Monthly: fetch UK HPI, ONS private rents, Bank of England quoted rates and ONS local authority
# names, rebuild data/areas.json, rates.json and sources.json, check them, and open a PR.
# If any check fails, nothing is committed and the site keeps its last good data.
#
# - schedule (06:17 UTC on the 20th, after the mid-month ONS and HM Land Registry releases and
#   the Bank of England's 5th-working-day release) and workflow_dispatch: commit to
#   data/refresh-YYYY-MM and open a PR (or print the compare URL if Actions may not open PRs).
# - push to data-test/**: dry run. Same fetch, build and checks, a job summary and an artifact,
#   no PR. The files are also pushed to data-snapshot/<name> so they can be read without
#   downloading the artifact (the build container cannot reach artifact storage).
#
# Permissions are per job. The refresh job runs npm packages and parses downloaded files, so it
# gets a read-only token. Only the snapshot job (dry runs) and the pull-request job may push,
# and only the pull-request job gets pull-requests: write. Both take the files from the refresh
# job's artifact, so neither runs npm or touches the network sources.
on:
  schedule:
    - cron: '17 6 20 * *'
  workflow_dispatch:
    inputs:
      allow_count_drop:
        description: Accept areas disappearing (after an ONS boundary change)
        type: boolean
        default: false
      allow_moves:
        description: Accept month-on-month moves over the limits (after checking them)
        type: boolean
        default: false
  push:
    branches: ['data-test/**']

concurrency:
  group: refresh-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  refresh:
    name: Fetch, build and check data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch, transform and check
        id: refresh
        env:
          MODE: ${{ github.event_name == 'push' && 'dry run' || github.event_name }}
          ALLOW_COUNT_DROP: ${{ inputs.allow_count_drop || false }}
          ALLOW_MOVES: ${{ inputs.allow_moves || false }}
        run: |
          mkdir -p out
          args=(--out out --summary out/summary.md --mode "$MODE")
          if [ "$ALLOW_COUNT_DROP" = "true" ]; then args+=(--allow-count-drop); fi
          if [ "$ALLOW_MOVES" = "true" ]; then args+=(--allow-moves); fi
          npx tsx scripts/refresh-data.ts "${args[@]}"

      - name: Upload generated data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ github.run_id }}
          path: out/
          if-no-files-found: warn

      # The new files go into data/ in the workspace so the tests (which validate every data
      # file) and the build run against them. PRs opened with GITHUB_TOKEN do not trigger CI,
      # so this is the check that the site still builds with the new data. If it fails, the
      # snapshot and pull-request jobs do not run.
      - name: Test and build with the new data
        run: |
          cp out/areas.json out/rates.json out/sources.json data/
          npm test
          npm run build

  snapshot:
    name: Publish dry-run snapshot
    needs: refresh
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download generated data
        uses: actions/download-artifact@v8
        with:
          name: data-${{ github.run_id }}
          path: out

      - name: Push to data-snapshot/<name>
        env:
          TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          branch="data-snapshot/${REF_NAME#data-test/}"
          dir=$(mktemp -d)
          cp out/areas.json out/rates.json out/sources.json out/summary.md "$dir/"
          cd "$dir"
          git init -q -b snapshot
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Data snapshot from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          echo "Snapshot pushed to ${branch}" >> "$GITHUB_STEP_SUMMARY"

  pull-request:
    name: Commit and open a pull request
    needs: refresh
    if: github.event_name != 'push' && needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download generated data
        uses: actions/download-artifact@v8
        with:
          name: data-${{ github.run_id }}
          path: out

      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="data/refresh-$(date -u +%Y-%m)"
          cp out/areas.json out/rates.json out/sources.json data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/areas.json data/rates.json data/sources.json
          git commit -q -m "Data refresh $(date -u +%Y-%m)" -m "Generated by the refresh-data workflow, run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
          title="Data refresh $(date -u +%Y-%m)"
          base=main
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file out/summary.md
            echo "Updated the open PR for ${branch}." >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --base "$base" --head "$branch" --title "$title" --body-file out/summary.md; then
            echo "Opened a PR for ${branch}." >> "$GITHUB_STEP_SUMMARY"
          else
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${base}...${branch}?expand=1"
            echo "::warning::Could not open a PR (Actions may not be allowed to create PRs in this repo). Open it here: ${url}"
            echo "Could not open a PR automatically. Open it here: ${url}" >> "$GITHUB_STEP_SUMMARY"
          fi

  no-changes:
    name: No changes
    needs: refresh
    if: github.event_name != 'push' && needs.refresh.outputs.changed != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Say so
        run: echo "The sources have not changed since the committed data. No PR." >> "$GITHUB_STEP_SUMMARY"
