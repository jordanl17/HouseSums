name: Data probe
on:
  push:
    branches: ['data-test/probe']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash probe.sh
      - name: Push raw files to probe-out
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b probe-out
          git -c user.name=probe -c user.email=probe@users.noreply.github.com add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "probe output"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-out
